<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World | Python on AWS EC2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px 35px;
            border-radius: 20px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            color: #1e293b;
            margin-bottom: 20px;
        }

        p {
            color: #64748b;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 32px;
            }

            .container {
                padding: 35px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <span class="badge">✓ AWS EC2 Connected</span>

        <h1>Hello World! 🚀</h1>

        <p>
            Congratulations! Your Python web project is running.
            Welcome to my first application hosted on AWS EC2.
        </p>

        <a href="/" class="button">Back to Home</a>

        <footer>
            Built with HTML, CSS, Python and Flask
        </footer>
    </div>
</body>
</html>
